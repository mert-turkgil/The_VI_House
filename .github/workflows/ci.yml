# Build check for pull requests and feature branches. Pushes to master are covered by deploy.yml,
# which does the same build before publishing — running both there would just build twice.

name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches-ignore: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # The ViteBuild MSBuild target runs `npm run build` inside every `dotnet build`, so Node has to
      # be on the runner before .NET touches the project.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/VIHouse.WebUI/ClientApp/package-lock.json

      - name: Install ClientApp dependencies
        working-directory: src/VIHouse.WebUI/ClientApp
        run: npm ci

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VIHouse.slnx

      # ImageSharp 4.x refuses a Release build without a Six Labors licence (held in the
      # SIXLABORS_LICENSE secret). GitHub never hands secrets to pull requests from forks, so for
      # those — outside contributors — the check builds and tests in Debug, which only warns.
      # deploy.yml always builds Release with the licence.
      - name: Write Six Labors licence
        working-directory: src/VIHouse.WebUI
        env:
          SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
        run: |
          if [ -z "$SIXLABORS_LICENSE" ]; then
            echo "::notice::No SIXLABORS_LICENSE in this run (a fork's pull request) — building Debug."
            echo "BUILD_CONFIGURATION=Debug" >> "$GITHUB_ENV"
          else
            printf '%s' "$SIXLABORS_LICENSE" > sixlabors.lic
            echo "BUILD_CONFIGURATION=Release" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: dotnet build VIHouse.slnx --configuration "$BUILD_CONFIGURATION" --no-restore

      - name: Test
        run: dotnet test VIHouse.slnx --configuration "$BUILD_CONFIGURATION" --no-build --verbosity normal
