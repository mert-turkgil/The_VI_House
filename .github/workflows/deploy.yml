# Deploys the site to MonsterASP over FTP on every push to master.
#
# What happens, in order:
#   1. Build the ClientApp (Vite), fetch the site photography, publish the .NET app.
#   2. Write appsettings.Production.json from GitHub Secrets + the env block below. The file is
#      gitignored on purpose — this is the only place production configuration is assembled.
#   3. If the build carries migrations the database has not seen, export a .bacpac backup of the
#      production database to /Backup/ on the FTP account, then apply the migrations (the app never
#      migrates on boot in Production — see the "Seeding" section of Program.cs).
#   4. Put app_offline.htm in place so IIS stops the app and releases its file locks, wait, upload
#      the publish output, then remove app_offline.htm so IIS starts the new build.
#
# Non-secret configuration lives in the `env:` block below and is changed by editing this file.
# Secrets live in GitHub → Settings → Secrets and variables → Actions (see the list at the bottom).
#
# Things the app writes at runtime (data-protection keys in App_Data, uploaded media in App_Media)
# live inside the site folder and survive deployments: the FTP sync only deletes files it uploaded
# itself. Never turn on dangerous-clean-slate — that would wipe them.

name: Deploy to MonsterASP

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# Two pushes in quick succession must not interleave their FTP uploads.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # --- Feature switches (Features section; see VIHouse.Business/Options/FeatureOptions.cs) ---------
  # ComingSoon holds the public site behind /coming-soon; admins sign in and pass through. Flip to
  # 'false' and push to launch. (Editing the file on the server also works until the next deploy
  # writes this value over it again.)
  FEATURE_COMING_SOON: 'true'
  FEATURE_REQUIRE_TWO_FACTOR: 'true'
  FEATURE_MEMBERSHIP_SALES: 'true'
  FEATURE_MEMBER_DIRECTORY: 'false'
  FEATURE_COMMUNITY: 'false'

  # --- Site identity ------------------------------------------------------------------------------
  SITE_BASE_URL: 'https://thevihouse.com'
  SITE_CONTACT_EMAIL: 'concierge@thevihouse.com'
  # Leave both EMPTY until thevihouse.com AND admin.thevihouse.com are bound to the MonsterASP site.
  # With a CookieDomain set while the site is still served from a *.runasp.net address, browsers
  # reject the auth cookie and nobody can sign in; with AdminHost set, /Admin only answers on that
  # host. Once DNS is live: ADMIN_HOST 'admin.thevihouse.com', COOKIE_DOMAIN '.thevihouse.com'.
  ADMIN_HOST: ''
  COOKIE_DOMAIN: ''

  # --- Outbound email (Hostinger mailbox for thevihouse.com; see SmtpOptions.cs) -------------------
  # Host/port come from hPanel's "Connect apps" / "Configure email client" screen for the mailbox —
  # Hostinger sells three mail products (Hostinger Email, Titan Email, cPanel mail) with different
  # SMTP hostnames, so that screen is authoritative, not this comment. 465 is implicit TLS
  # (SslOnConnect); 587 negotiates plaintext-then-upgrade (StartTls) — SmtpEmailSender picks the
  # right one from SMTP_PORT automatically, so only the port needs to match what hPanel actually says.
  # SMTP_USERNAME/SMTP_PASSWORD are secrets — see the bottom of this file — not the Hostinger API
  # key, which authenticates a different, HTTP-based Mail API this app does not use.
  SMTP_HOST: 'smtp.hostinger.com'
  SMTP_PORT: '587'
  SMTP_USE_SSL: 'true'
  SMTP_FROM_NAME: 'The VI House'
  SMTP_FROM_EMAIL: 'concierge@thevihouse.com'

  # --- Storage paths (empty = inside the site folder: App_Data/dp-keys, App_Media, Resources) -------
  # Only set these to ABSOLUTE Windows paths that the MonsterASP app pool can write to. A path it
  # cannot create makes the app fail at startup. Relative paths are resolved against the process
  # working directory, not the app folder, so do not use them here.
  # Note: with RESOURCES_PATH empty the .resx files ship with each deploy, so translations edited in
  # Admin → Translations must be exported (Download .resx files) and committed to survive a deploy.
  MEDIA_ROOT_PATH: ''
  DATA_PROTECTION_KEYS_PATH: ''
  RESOURCES_PATH: ''


  # --- SMS gateway (dormant until a gateway account exists; see SmsOptions.cs) --------------------
  SMS_ENABLED: 'false'
  SMS_ENDPOINT: 'https://api.twilio.com/2010-04-01/Accounts/REPLACE_WITH_ACCOUNT_SID/Messages.json'
  SMS_FROM: ''
  SMS_DEFAULT_COUNTRY_CODE: ''

  # --- Deployment mechanics ------------------------------------------------------------------------
  # How long to wait after app_offline.htm lands before uploading DLLs. IIS on shared hosting can be
  # slow to release file locks; uploads that hit a locked DLL fail the whole deploy.
  OFFLINE_WAIT_SECONDS: '120'
  PUBLISH_DIR: publish

  # --- Pre-migration database backup ---------------------------------------------------------------
  # A .bacpac (schema + data) exported with SqlPackage and uploaded to /<BACKUP_DIR>/ at the FTP
  # root — next to wwwroot/, never inside it, because the file holds every member's data and must
  # not be web-reachable. Taken only when a deploy has migrations to apply (or always, with
  # BACKUP_ALWAYS). The panel cannot restore a .bacpac directly; see .github/deploy/RESTORE.md.
  BACKUP_DIR: 'Backup'
  BACKUP_KEEP: '10'
  BACKUP_ALWAYS: 'false'

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PROD_CONNECTION_STRING: ${{ secrets.PROD_CONNECTION_STRING }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CKEDITOR_LICENSE_KEY: ${{ secrets.CKEDITOR_LICENSE_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD PROD_CONNECTION_STRING; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          # Not fatal, but each of these leaves a feature dark; say so in the run log.
          [ -n "$SEED_ADMIN_EMAIL" ]     || echo "::warning::SEED_ADMIN_EMAIL is empty — a fresh database will have no admin account."
          [ -n "$STRIPE_SECRET_KEY" ]    || echo "::warning::STRIPE_TEST_SECRET_KEY is empty — payments are off."
          [ -n "$GOOGLE_CLIENT_ID" ]     || echo "::warning::GOOGLE_CLIENT_ID is empty — Google sign-in is off."
          [ -n "$CKEDITOR_LICENSE_KEY" ] || echo "::warning::CKEDITOR_LICENSE_KEY is empty — the admin rich-text editor will not load."
          [ -n "$SMTP_USERNAME" ]        || echo "::warning::SMTP_USERNAME is empty — outbound email (2FA/receipt/contact mail) is off."

      # --- Build -----------------------------------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/VIHouse.WebUI/ClientApp/package-lock.json

      - name: Install ClientApp dependencies
        working-directory: src/VIHouse.WebUI/ClientApp
        run: npm ci

      # wwwroot/img is gitignored; the manifest is the source of truth. Without this every cover
      # renders the crest placeholder, and MapStaticAssets only serves files present at build time.
      - name: Fetch site photography
        working-directory: src/VIHouse.WebUI/ClientApp
        run: npm run fetch:media

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VIHouse.slnx

      # ImageSharp 4.x validates a Six Labors licence at build time and treats a missing one as an
      # error in Release. The Community licence file (free, see sixlabors.com/pricing) is held in
      # the SIXLABORS_LICENSE secret as its full text and written next to the project, where the
      # package's targets search for it (**/sixlabors.lic). Never committed — see .gitignore.
      - name: Write Six Labors licence
        working-directory: src/VIHouse.WebUI
        env:
          SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
        run: |
          if [ -z "$SIXLABORS_LICENSE" ]; then
            echo "::error::Repository secret SIXLABORS_LICENSE is not set — ImageSharp refuses a Release build without it."
            exit 1
          fi
          printf '%s' "$SIXLABORS_LICENSE" > sixlabors.lic

      # Written before publish so the Web SDK picks it up like any other appsettings*.json.
      # jq --arg does the JSON escaping, so passwords with quotes/backslashes/% survive intact.
      - name: Write appsettings.Production.json
        working-directory: src/VIHouse.WebUI
        env:
          PROD_CONNECTION_STRING: ${{ secrets.PROD_CONNECTION_STRING }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SMS_USERNAME: ${{ secrets.SMS_USERNAME }}
          SMS_PASSWORD: ${{ secrets.SMS_PASSWORD }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CKEDITOR_LICENSE_KEY: ${{ secrets.CKEDITOR_DEV_LICENSE_KEY }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SEED_ADMINS_JSON: ${{ secrets.SEED_ADMINS_JSON }}
        run: |
          jq -n \
            --argjson comingSoon        "$FEATURE_COMING_SOON" \
            --argjson requireTwoFactor  "$FEATURE_REQUIRE_TWO_FACTOR" \
            --argjson membershipSales   "$FEATURE_MEMBERSHIP_SALES" \
            --argjson memberDirectory   "$FEATURE_MEMBER_DIRECTORY" \
            --argjson community         "$FEATURE_COMMUNITY" \
            --arg     connectionString  "$PROD_CONNECTION_STRING" \
            --arg     stripeSecret      "$STRIPE_SECRET_KEY" \
            --arg     stripePublishable "$STRIPE_PUBLISHABLE_KEY" \
            --arg     stripeWebhook     "$STRIPE_WEBHOOK_SECRET" \
            --arg     googleClientId    "$GOOGLE_CLIENT_ID" \
            --arg     googleSecret      "$GOOGLE_CLIENT_SECRET" \
            --argjson smsEnabled        "$SMS_ENABLED" \
            --arg     smsEndpoint       "$SMS_ENDPOINT" \
            --arg     smsFrom           "$SMS_FROM" \
            --arg     smsCountryCode    "$SMS_DEFAULT_COUNTRY_CODE" \
            --arg     smsUsername       "$SMS_USERNAME" \
            --arg     smsPassword       "$SMS_PASSWORD" \
            --arg     smtpHost          "$SMTP_HOST" \
            --argjson smtpPort          "$SMTP_PORT" \
            --argjson smtpUseSsl        "$SMTP_USE_SSL" \
            --arg     smtpFromName      "$SMTP_FROM_NAME" \
            --arg     smtpFromEmail     "$SMTP_FROM_EMAIL" \
            --arg     smtpUsername      "$SMTP_USERNAME" \
            --arg     smtpPassword      "$SMTP_PASSWORD" \
            --arg     ckeditorKey       "$CKEDITOR_LICENSE_KEY" \
            --arg     mediaRoot         "$MEDIA_ROOT_PATH" \
            --arg     dpKeysPath        "$DATA_PROTECTION_KEYS_PATH" \
            --arg     resourcesPath     "$RESOURCES_PATH" \
            --arg     adminHost         "$ADMIN_HOST" \
            --arg     cookieDomain      "$COOKIE_DOMAIN" \
            --arg     siteBaseUrl       "$SITE_BASE_URL" \
            --arg     siteContactEmail  "$SITE_CONTACT_EMAIL" \
            --arg     seedAdminEmail    "$SEED_ADMIN_EMAIL" \
            --arg     seedAdminPassword "$SEED_ADMIN_PASSWORD" \
            --arg     seedAdminsJson    "$SEED_ADMINS_JSON" \
            '{
              Features: {
                ComingSoon: $comingSoon,
                RequireTwoFactor: $requireTwoFactor,
                MembershipSales: $membershipSales,
                MemberDirectory: $memberDirectory,
                Community: $community
              },
              Logging: { LogLevel: { Default: "Warning", "Microsoft.AspNetCore": "Warning" } },
              ConnectionStrings: { DefaultConnection: $connectionString },
              Stripe: {
                SecretKey: $stripeSecret,
                PublishableKey: $stripePublishable,
                WebhookSecret: $stripeWebhook
              },
              Authentication: { Google: { ClientId: $googleClientId, ClientSecret: $googleSecret } },
              Sms: {
                Enabled: $smsEnabled, Endpoint: $smsEndpoint, From: $smsFrom,
                Username: $smsUsername, Password: $smsPassword,
                DefaultCountryCode: $smsCountryCode
              },
              Smtp: {
                Host: $smtpHost, Port: $smtpPort, UseSsl: $smtpUseSsl,
                FromName: $smtpFromName, FromEmail: $smtpFromEmail,
                Username: $smtpUsername, Password: $smtpPassword
              },
              CkEditor: { LicenseKey: $ckeditorKey },
              Media: { RootPath: $mediaRoot },
              DataProtection: { KeysPath: $dpKeysPath },
              Localization: { ResourcesPath: $resourcesPath },
              AdminHost: $adminHost,
              CookieDomain: $cookieDomain,
              Site: { BaseUrl: $siteBaseUrl, ContactEmail: $siteContactEmail },
              SeedAdmin: { Email: $seedAdminEmail, Password: $seedAdminPassword, Roles: ["SuperAdmin"] },
              SeedAdmins: (if $seedAdminsJson == "" then [] else ($seedAdminsJson | fromjson) end)
            }' > appsettings.Production.json

          echo "appsettings.Production.json written. Non-secret sections:"
          jq 'del(.ConnectionStrings, .Stripe, .Authentication, .Sms, .Smtp, .CkEditor, .SeedAdmin, .SeedAdmins)' appsettings.Production.json
          echo "Smtp (secrets redacted): host=$(jq -r '.Smtp.Host' appsettings.Production.json):$(jq -r '.Smtp.Port' appsettings.Production.json), from=$(jq -r '.Smtp.FromEmail' appsettings.Production.json), username set: $(jq -r '.Smtp.Username != ""' appsettings.Production.json)"

      - name: Publish
        run: >
          dotnet publish src/VIHouse.WebUI/VIHouse.WebUI.csproj
          --configuration Release
          --no-restore
          --output ${{ env.PUBLISH_DIR }}

      - name: Verify publish output
        run: |
          cd "$PUBLISH_DIR"
          for f in VIHouse.WebUI.dll web.config appsettings.json appsettings.Production.json \
                   wwwroot/brand/coming-soon.jpg wwwroot/dist Resources/SharedResource.resx; do
            [ -e "$f" ] || { echo "::error::Expected $f in the publish output."; exit 1; }
          done
          [ ! -e appsettings.Development.json ] || { echo "::error::appsettings.Development.json must not be published."; exit 1; }
          img_count=$(find wwwroot/img -type f 2>/dev/null | wc -l)
          echo "wwwroot/img files: $img_count"
          [ "$img_count" -gt 0 ] || { echo "::error::No photography in wwwroot/img — fetch:media did not populate it."; exit 1; }

          # A file being in wwwroot is not enough: MapStaticAssets serves only what the static web
          # assets manifest lists, and anything not listed falls through to the Coming Soon redirect.
          # Vite output is generated during the build, so it is the thing most likely to be missing
          # (see the ViteBuild target in VIHouse.WebUI.csproj for how that happened once).
          manifest=VIHouse.WebUI.staticwebassets.endpoints.json
          for route in dist/main.css dist/main.js dist/admin.css dist/admin.js brand/coming-soon.jpg video/auth-backdrop.mp4; do
            jq -e --arg r "$route" 'any(.Endpoints[]; .Route == $r)' "$manifest" > /dev/null \
              || { echo "::error::$route is not in the static web assets manifest — it would 302 to /coming-soon in production."; exit 1; }
          done
          # The bundles import shared chunks by relative path at runtime. A chunk that is on disk but
          # not in the manifest is redirected to /coming-soon, the browser gets HTML where it expected
          # a module, and every script on the site dies with it — so each one is checked too.
          for chunk in wwwroot/dist/chunks/*.js; do
            [ -e "$chunk" ] || continue
            route="${chunk#wwwroot/}"
            jq -e --arg r "$route" 'any(.Endpoints[]; .Route == $r)' "$manifest" > /dev/null               || { echo "::error::$route is not in the static web assets manifest."; exit 1; }
          done
          echo "manifest routes: $(jq '.Endpoints | length' "$manifest") (dist/: $(jq '[.Endpoints[] | select(.Route | startswith("dist/"))] | length' "$manifest"))"

      # --- Database --------------------------------------------------------------------------------
      # Runs against the current bin/Release output (--no-build) and before the site goes offline,
      # so a failed migration leaves the old build running untouched.
      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      # `migrations list` marks unapplied migrations "(Pending)". Needs the same Production
      # environment as the update step below, for the same reason (see that step's comment).
      - name: Check for pending migrations
        id: pending
        env:
          ASPNETCORE_ENVIRONMENT: Production
          PROD_CONNECTION_STRING: ${{ secrets.PROD_CONNECTION_STRING }}
        run: |
          list=$(dotnet ef migrations list \
            --project src/VIHouse.DataAccess \
            --startup-project src/VIHouse.WebUI \
            --configuration Release \
            --no-build \
            --connection "$PROD_CONNECTION_STRING")
          printf '%s\n' "$list"
          count=$(printf '%s\n' "$list" | grep -c '(Pending)' || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Pending migrations: $count"

      # SqlPackage export works with the ordinary db_owner login — no BACKUP DATABASE permission or
      # server-side file path needed, which shared hosting does not give us. The site is still
      # online during the export; for this site's traffic that is fine. If the export fails the
      # deploy stops here, before anything has been changed.
      - name: Back up production database
        if: steps.pending.outputs.count != '0' || env.BACKUP_ALWAYS == 'true'
        env:
          PROD_CONNECTION_STRING: ${{ secrets.PROD_CONNECTION_STRING }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          dotnet tool install --global microsoft.sqlpackage
          file="vihouse-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}.bacpac"

          "$HOME/.dotnet/tools/sqlpackage" /Action:Export \
            /SourceConnectionString:"$PROD_CONNECTION_STRING" \
            /TargetFile:"$file"
          ls -la "$file"

          # --ftp-create-dirs makes /Backup/ on the first run.
          curl --silent --show-error --fail --ftp-create-dirs \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file "$file" \
            "ftp://$FTP_SERVER/$BACKUP_DIR/$file"
          echo "Uploaded to /$BACKUP_DIR/$file"
          {
            echo "### Database backup"
            echo "Pending migrations: **${{ steps.pending.outputs.count }}** — exported \`/$BACKUP_DIR/$file\` ($(du -h "$file" | cut -f1)) before applying them."
            echo "Restore instructions: .github/deploy/RESTORE.md"
          } >> "$GITHUB_STEP_SUMMARY"

          # Retention: names sort chronologically, so keep the last BACKUP_KEEP and delete the rest.
          existing=$(curl --silent --show-error --fail --list-only \
            --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/$BACKUP_DIR/" \
            | sed 's|.*/||' | grep -E '^vihouse-.*\.bacpac$' | sort)
          total=$(printf '%s\n' "$existing" | grep -c . || true)
          if [ "$total" -gt "$BACKUP_KEEP" ]; then
            printf '%s\n' "$existing" | head -n $((total - BACKUP_KEEP)) | while read -r old; do
              # Housekeeping only: the new backup is already safe, so a failed delete just warns.
              if curl --silent --show-error --fail \
                   --user "$FTP_USERNAME:$FTP_PASSWORD" \
                   --quote "DELE $BACKUP_DIR/$old" --list-only "ftp://$FTP_SERVER/$BACKUP_DIR/" \
                   --output /dev/null; then
                echo "Deleted old backup $old"
              else
                echo "::warning::Could not delete old backup $old — remove it by hand in WebFTP."
              fi
            done
          fi

      - name: Apply database migrations
        env:
          # dotnet ef's design-time host defaults to the Development environment when this is unset
          # (verified locally) — it then looks for appsettings.Development.json, which does not exist
          # on this runner, GetConnectionString("DefaultConnection") comes back null, and Program.cs's
          # own `?? throw` fires before --connection below ever gets a chance to help (that flag only
          # overrides the connection string *after* the host has already built successfully). This is
          # what "Connection string 'DefaultConnection' not found" during this step actually means.
          ASPNETCORE_ENVIRONMENT: Production
          PROD_CONNECTION_STRING: ${{ secrets.PROD_CONNECTION_STRING }}
        run: >
          dotnet ef database update
          --project src/VIHouse.DataAccess
          --startup-project src/VIHouse.WebUI
          --configuration Release
          --no-build
          --connection "$PROD_CONNECTION_STRING"

      # --- Deploy ----------------------------------------------------------------------------------
      # app_offline.htm is handled with plain curl rather than the sync action: the sync action keeps
      # a state file, and a second run would see "already uploaded, unchanged" and skip it.
      - name: Take site offline (upload app_offline.htm)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: >
          curl --silent --show-error --fail
          --user "$FTP_USERNAME:$FTP_PASSWORD"
          --upload-file .github/deploy/app_offline.htm
          "ftp://$FTP_SERVER/wwwroot/app_offline.htm"

      - name: Wait for IIS to release file locks
        run: sleep "$OFFLINE_WAIT_SECONDS"

      - name: Upload publish output
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ${{ env.PUBLISH_DIR }}/
          server-dir: /wwwroot/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Bring site online (delete app_offline.htm)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: >
          curl --silent --show-error --fail
          --user "$FTP_USERNAME:$FTP_PASSWORD"
          --quote "DELE wwwroot/app_offline.htm"
          --list-only
          "ftp://$FTP_SERVER/wwwroot/"
          --output /dev/null

      # First request after a deploy is what makes IIS start the app, so this doubles as warm-up.
      # Non-fatal: the deploy already happened, and the domain may not be pointed at the host yet.
      - name: Smoke check
        continue-on-error: true
        run: >
          curl --silent --show-error --fail --location
          --retry 8 --retry-delay 15 --retry-all-errors
          --output /dev/null --write-out "HTTP %{http_code} from %{url_effective}\n"
          "$SITE_BASE_URL/"

# ---------------------------------------------------------------------------------------------------
# Repository secrets this workflow reads (Settings → Secrets and variables → Actions → New secret):
#
#   FTP_SERVER              MonsterASP FTP host name only, no protocol (from the control panel)
#   FTP_USERNAME            MonsterASP FTP user
#   FTP_PASSWORD            MonsterASP FTP password
#   PROD_CONNECTION_STRING  ConnectionStrings:DefaultConnection for the production database
#   STRIPE_TEST_SECRET_KEY      Stripe:SecretKey    (sk_test_… — swap for live keys at launch)
#   STRIPE_TEST_PUBLISHABLE_KEY Stripe:PublishableKey (pk_test_…)
#   STRIPE_WEBHOOK_SECRET   Stripe:WebhookSecret    (from the Stripe Dashboard webhook endpoint)
#   GOOGLE_CLIENT_ID        Authentication:Google:ClientId
#   GOOGLE_CLIENT_SECRET    Authentication:Google:ClientSecret
#   SMS_USERNAME            Sms:Username
#   SMS_PASSWORD            Sms:Password
#   SMTP_USERNAME           Smtp:Username  (the Hostinger mailbox's full address, e.g.
#                           concierge@thevihouse.com — NOT the Hostinger API key, which authenticates
#                           a separate HTTP-based Mail API this app does not use)
#   SMTP_PASSWORD           Smtp:Password  (that mailbox's real password)
#   CKEDITOR_LICENSE_KEY    CkEditor:LicenseKey     (production key; CKEDITOR_DEV_LICENSE_KEY is not
#                           read here — its licence only allows localhost / private IPs)
#   SEED_ADMIN_EMAIL        SeedAdmin:Email         (bootstrap SuperAdmin; ignored once the account exists)
#   SEED_ADMIN_PASSWORD     SeedAdmin:Password
#   SEED_ADMINS_JSON        optional: extra bootstrap admins as a JSON array, same shape as the
#                           SeedAdmins section of appsettings.Production.json
# ---------------------------------------------------------------------------------------------------
